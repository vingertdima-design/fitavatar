<!-- Заставка с логотипом и названием -->
<div id="splash" style="position:fixed;inset:0;z-index:10000;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .45s ease">
  <img src="logo.png" alt="FitAvatar" width="320" height="320" style="width:min(72vw,340px);height:auto">
</div>
<script>try{var th=new URLSearchParams(location.search).get('theme');if(th)document.documentElement.dataset.theme=th}catch(e){}</script>
<script>setTimeout(function(){var s=document.getElementById('splash');if(!s)return;s.style.opacity=0;s.style.pointerEvents='none';setTimeout(function(){s.remove()},500)},1100)</script>
